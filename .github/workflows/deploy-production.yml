# 部署到正式域名 ark.kaltsit.dev（Worker arkrecord，配置见 wrangler.jsonc 的 env.production）。
#
# 触发方式：
#   - 推送版本标签 v*（例如 v1.0.0）
#   - 推送到默认分支 master
#   - 开发分支上提交说明含有 [deploy production] 的推送（其余推送跳过）
#   - 每 3 小时一次，更新游戏数据（卡池、UP 名单、新角色头像）；定时任务只在默认分支上生效
#   - 在 Actions 页面手动运行（工作流在默认分支上之后才可用）
name: Deploy production

on:
  push:
    tags: ['v*']
    branches: [master, claude/laughing-mccarthy-yfzd6y]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # 开发分支的推送只有提交说明里写明 [deploy production] 才部署到正式环境
    if: >-
      github.event_name != 'push' || github.ref_type == 'tag' || github.ref == 'refs/heads/master' ||
      contains(github.event.head_commit.message, '[deploy production]')
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/cache@v6
        with:
          path: |
            public/gamedata/avatars
            public/gamedata/ef-avatars
          key: avatars-${{ github.run_id }}
          restore-keys: avatars-

      - name: 拉取游戏数据与头像
        run: node scripts/sync-gamedata.mjs --force
      - name: 检查
        run: |
          npx oxlint
          npx vue-tsc -b
          npx vitest run
      # Cloudflare 的 Vite 插件在构建时选定环境，部署时沿用构建产物里的配置
      - name: 构建（正式环境）
        run: npx vite build
        env:
          CLOUDFLARE_ENV: production

      - name: 尚未配置 Cloudflare 密钥
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::notice::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过部署（见 docs/rewrite/README.md）"

      - name: 部署到 Cloudflare Workers（正式环境）
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
