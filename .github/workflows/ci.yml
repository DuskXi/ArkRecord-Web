name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # 头像缓存：已下载的头像会被脚本跳过，只补新干员
      - uses: actions/cache@v6
        with:
          path: public/gamedata/avatars
          key: avatars-${{ github.run_id }}
          restore-keys: avatars-

      - name: 拉取游戏数据与头像
        run: node scripts/sync-gamedata.mjs --force
      - name: Lint
        run: npx oxlint
      - name: 类型检查
        run: npx vue-tsc -b
      - name: 测试
        run: npx vitest run
      - name: 构建
        run: npx vite build
