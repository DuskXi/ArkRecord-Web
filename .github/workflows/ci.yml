name: CI

on:
  push:
  pull_request:

# 网页版的检查、构建和部署用不到 Electron 本体（只有桌面版要），npm ci 时不下载
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # 头像缓存：已下载的头像会被脚本跳过，只补新干员
      - uses: actions/cache@v6
        with:
          path: |
            public/gamedata/avatars
            public/gamedata/ef-avatars
          key: avatars-${{ github.run_id }}
          restore-keys: avatars-

      - name: 拉取游戏数据与头像
        run: node scripts/sync-gamedata.mjs --force
      - name: Lint
        run: npx oxlint
      - name: 类型检查
        run: npx vue-tsc -b
      - name: 测试
        run: npx vitest run
      - name: 构建
        run: npx vite build

  # 桌面版的 Python 后端（desktop/backend）。三个平台都跑：stdio 编码、换行在 Windows 上最容易出问题
  desktop-backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/backend
    steps:
      - uses: actions/checkout@v7
      - name: 安装 uv
        run: pipx install uv==0.11.32
      - name: 安装依赖（按 uv.lock）
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: 格式检查
        run: uv run ruff format --check .
      - name: 测试
        run: uv run pytest
