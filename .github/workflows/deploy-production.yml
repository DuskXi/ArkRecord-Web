# 部署到正式域名 ark.kaltsit.dev（Worker arkrecord，配置见 wrangler.jsonc 的 env.production）。
#
# 触发方式：推送到 master、推送版本标签 v*（例如 v1.0.0）、在 Actions 页面手动运行。
# 每次部署都会重新拉取游戏数据。定时更新游戏数据暂未开启，需要时加上：
#   schedule:
#     - cron: '17 */3 * * *'
name: Deploy production

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/cache@v6
        with:
          path: |
            public/gamedata/avatars
            public/gamedata/ef-avatars
          key: avatars-${{ github.run_id }}
          restore-keys: avatars-

      - name: 拉取游戏数据与头像
        run: node scripts/sync-gamedata.mjs --force
      - name: 检查
        run: |
          npx oxlint
          npx vue-tsc -b
          npx vitest run
      # Cloudflare 的 Vite 插件在构建时选定环境，部署时沿用构建产物里的配置
      - name: 构建（正式环境）
        run: npx vite build
        env:
          CLOUDFLARE_ENV: production

      - name: 尚未配置 Cloudflare 密钥
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::notice::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过部署（见 docs/rewrite/README.md）"

      - name: 部署到 Cloudflare Workers（正式环境）
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
