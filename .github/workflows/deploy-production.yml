# 部署到正式域名 ark.kaltsit.dev（Worker arkrecord，配置见 wrangler.jsonc 的 env.production）。
#
# 触发方式：推送到 master、推送版本标签 v*（例如 v1.0.0）、在 Actions 页面手动运行。
# 每次部署都会重新拉取游戏数据。定时更新游戏数据暂未开启，需要时加上：
#   schedule:
#     - cron: '17 */3 * * *'
# 分成四个任务（见 SECURITY.md 的“对照线上代码”）：
#   build   安装依赖、检查、构建，生成构建清单（网站每个文件和 Worker 每个模块的 SHA-256）；
#   attest  签发构建证明，记录在 Sigstore 的公开透明日志里。只有这个任务有签发权限，而且不检出代码、不安装任何依赖：
#           即使某个 npm 依赖被投毒，也拿不到签发权限，没法给别的代码伪造“本仓库构建”的证明；
#   deploy  部署 build 产出的那一份文件（和签发证明的是同一份），Worker 版本标记为 commit；
#   audit   部署后立即核对线上的网站文件和 Worker 代码（audit-deployment.yml）。
name: Deploy production

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

# 网页版的检查、构建和部署用不到 Electron 本体（只有桌面版要），npm ci 时不下载
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      can-deploy: ${{ steps.token.outputs.ok }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: actions/cache@v6
        with:
          path: |
            public/gamedata/avatars
            public/gamedata/ef-avatars
          key: avatars-${{ github.run_id }}
          restore-keys: avatars-

      - name: 拉取游戏数据与头像
        run: node scripts/sync-gamedata.mjs --force
      - name: 检查
        run: |
          npx oxlint
          npx vue-tsc -b
          npx vitest run
      # Cloudflare 的 Vite 插件在构建时选定环境，部署时沿用构建产物里的配置
      - name: 构建（正式环境）
        run: npx vite build
        env:
          CLOUDFLARE_ENV: production
      # 网站每个文件和 Worker 每个模块的 SHA-256，随网站公开在 /build-manifest.json
      - name: 生成构建清单
        run: node scripts/audit/manifest.mjs --env production

      - name: 是否配置了 Cloudflare 密钥
        id: token
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "ok=$HAS_CF_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_CF_TOKEN" != true ]; then echo "::notice::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过部署（见 docs/rewrite/README.md）"; fi

      # 构建产物交给后面的任务：.wrangler/deploy/config.json 指向 dist 里 Cloudflare 插件生成的部署配置
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist/
            .wrangler/deploy/config.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  attest:
    needs: build
    if: needs.build.outputs.can-deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
      # 构建清单和 Worker 的每个模块（dist/attestation-subjects.sha256）
      - name: 签发构建证明
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: dist/attestation-subjects.sha256

  deploy:
    needs: [build, attest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build

      # 版本标记为 commit，Cloudflare 后台和核对报告里都能看到
      - name: 部署到 Cloudflare Workers（正式环境）
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --tag ${{ github.sha }} --message actions-run-${{ github.run_id }}

  audit:
    needs: deploy
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/audit-deployment.yml
    with:
      environment: production
      expect-commit: ${{ github.sha }}
    secrets: inherit
